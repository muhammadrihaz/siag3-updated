version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siag3_web
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www/html
    environment:
      # CodeIgniter 4 Environment overrides
      - CI_ENVIRONMENT=development
      # Menghubungkan ke hostname container MySQL lokal
      - database.default.hostname=db
      - database.default.database=siag3
      - database.default.username=siag3_user
      - database.default.password=password
      - database.default.DBDriver=MySQLi
      - database.default.port=3306
    networks:
      - siag3_network
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: siag3_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: siag3
      MYSQL_USER: siag3_user
      MYSQL_PASSWORD: password
    volumes:
      - siag3_mysql_data:/var/lib/mysql
    networks:
      - siag3_network

networks:
  siag3_network:
    driver: bridge

volumes:
  siag3_mysql_data:
