version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siag3_web
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www/html
    environment:
      # CodeIgniter 4 Environment overrides
      - CI_ENVIRONMENT=development
      - database.default.hostname=mysql
      - database.default.database=siag3
      - database.default.username=sail
      - database.default.password=password
      - database.default.DBDriver=MySQLi
      - database.default.port=3306
    depends_on:
      - mysql
    networks:
      - siag3_network

  mysql:
    image: mysql:8.4
    container_name: siag3_db
    ports:
      # Mapped to 33062 on host to avoid port clashes with existings 'sail' mysql instances (3306 and 33061 shown in your docker ps)
      - "33062:3306"
    environment:
      - MYSQL_DATABASE=siag3
      - MYSQL_USER=sail
      - MYSQL_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=password
    volumes:
      - siag3_db_data:/var/lib/mysql
      # Auto-import siag3.sql on initial container startup (only runs if the db is completely empty)
      - ./siag3.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - siag3_network

volumes:
  siag3_db_data:

networks:
  siag3_network:
    driver: bridge
